<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">强化学习研究训练营</title>
  <desc id="desc">从智能体与环境交互，到价值方法、策略梯度、RLHF、GRPO 和 Agentic RAG 的学习路径。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3522"/>
      <stop offset="0.55" stop-color="#31572c"/>
      <stop offset="1" stop-color="#4f772d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d8f3dc"/>
    </marker>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#background)"/>
  <circle cx="1270" cy="70" r="210" fill="#a3b18a" opacity="0.10"/>
  <circle cx="80" cy="590" r="240" fill="#90a955" opacity="0.08"/>
  <text x="90" y="110" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" letter-spacing="5" fill="#d8f3dc">HANDS-ON RL BOOTCAMP</text>
  <text x="90" y="195" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="58" font-weight="700" fill="#ffffff">强化学习研究训练营</text>
  <text x="90" y="255" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" fill="#e9f5db">从智能体基础到 RLHF、GRPO 与 Agentic RAG</text>

  <rect x="90" y="320" width="280" height="150" rx="24" fill="url(#card)" stroke="#d8f3dc" stroke-opacity="0.55"/>
  <text x="230" y="382" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" fill="#ffffff">智能体 Agent</text>
  <text x="230" y="430" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" fill="#d8f3dc">策略 π(a|s)</text>

  <rect x="600" y="320" width="280" height="150" rx="24" fill="url(#card)" stroke="#d8f3dc" stroke-opacity="0.55"/>
  <text x="740" y="382" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" fill="#ffffff">环境 Environment</text>
  <text x="740" y="430" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" fill="#d8f3dc">状态转移与奖励</text>

  <line x1="370" y1="365" x2="590" y2="365" stroke="#d8f3dc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="480" y="346" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" fill="#ffffff">动作 a<tspan baseline-shift="sub" font-size="17">t</tspan></text>
  <line x1="600" y1="435" x2="380" y2="435" stroke="#d8f3dc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="490" y="468" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" fill="#ffffff">状态 s<tspan baseline-shift="sub" font-size="17">t+1</tspan> · 奖励 r<tspan baseline-shift="sub" font-size="17">t+1</tspan></text>

  <rect x="1030" y="312" width="280" height="170" rx="24" fill="#ecf39e" fill-opacity="0.16" stroke="#ecf39e" stroke-opacity="0.65"/>
  <text x="1170" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" fill="#ffffff">价值方法 · 策略梯度</text>
  <text x="1170" y="408" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" fill="#ffffff">RLHF · PPO · GRPO</text>
  <text x="1170" y="452" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" fill="#ffffff">Agentic RAG</text>
  <line x1="880" y1="395" x2="1020" y2="395" stroke="#d8f3dc" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="90" y="555" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" fill="#d8f3dc">3 个部分 · 8 章 · 强化学习中文学习电子书</text>
</svg>
