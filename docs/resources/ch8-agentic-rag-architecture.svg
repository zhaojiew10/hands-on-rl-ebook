<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RAG 的推理、搜索、观察与学习循环</title>
  <desc id="desc">语言模型生成推理和搜索动作，Elasticsearch 返回 Wikipedia 观察，模型最终作答；正确性、格式与检索质量奖励通过 GRPO 更新策略。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf5"/>
      <stop offset="1" stop-color="#eaf2e5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f772d"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#76548e"/>
    </marker>
  </defs>
  <rect width="1400" height="680" rx="26" fill="url(#bg)"/>
  <text x="700" y="65" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#243b20">Agentic RAG：工具交互轨迹与策略学习</text>

  <rect x="60" y="250" width="190" height="110" rx="20" fill="#ffffff" stroke="#90a955" stroke-width="2"/>
  <text x="155" y="295" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="600" fill="#31572c">用户提示</text>
  <text x="155" y="335" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" fill="#4f5d4a">问题 / 任务</text>

  <rect x="355" y="200" width="300" height="210" rx="24" fill="#ffffff" stroke="#4f772d" stroke-width="3"/>
  <text x="505" y="250" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#243b20">LLM 策略</text>
  <text x="505" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="25" fill="#4f772d">&lt;think&gt; 推理 &lt;/think&gt;</text>
  <text x="505" y="345" text-anchor="middle" font-family="Consolas, monospace" font-size="25" fill="#4f772d">&lt;search&gt; 查询 &lt;/search&gt;</text>
  <text x="505" y="385" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#4f5d4a">决定检索内容、时机与停止</text>

  <rect x="790" y="200" width="310" height="210" rx="24" fill="#ffffff" stroke="#4f772d" stroke-width="3"/>
  <text x="945" y="255" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#243b20">Wikipedia Search</text>
  <text x="945" y="305" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" fill="#31572c">Elasticsearch 本地索引</text>
  <text x="945" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#4f772d">&lt;observation&gt;</text>
  <text x="945" y="390" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#4f5d4a">工具观察，不作为策略动作</text>

  <rect x="1190" y="250" width="170" height="110" rx="20" fill="#ffffff" stroke="#90a955" stroke-width="2"/>
  <text x="1275" y="295" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" fill="#31572c">最终答案</text>
  <text x="1275" y="335" text-anchor="middle" font-family="Consolas, monospace" font-size="23" fill="#4f772d">&lt;answer&gt;</text>

  <line x1="250" y1="305" x2="345" y2="305" stroke="#4f772d" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="655" y1="270" x2="780" y2="270" stroke="#4f772d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="718" y="247" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" fill="#31572c">搜索动作</text>
  <line x1="1100" y1="305" x2="1180" y2="305" stroke="#4f772d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1140" y="280" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#31572c">作答</text>

  <path d="M945 410 C945 490, 650 490, 545 420" fill="none" stroke="#4f772d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="760" y="485" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#31572c">检索观察回到上下文，必要时继续搜索</text>

  <rect x="265" y="535" width="870" height="100" rx="22" fill="#76548e" fill-opacity="0.09" stroke="#76548e" stroke-width="2"/>
  <text x="700" y="575" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" fill="#654477">正确性奖励 + 格式奖励 + 检索质量奖励</text>
  <text x="700" y="615" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" fill="#654477">组内相对优势 → PPO 式裁剪目标 + KL 约束 → GRPO 更新</text>
  <path d="M700 535 C700 470, 610 450, 540 418" fill="none" stroke="#76548e" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-purple)"/>
</svg>
